schema_version: 1
experiment: source_a
dataset:
  version: source_v1
  normalization_version: clip_xyxy_to_image_bounds_v1
  names: [pedestrian, cyclist, car, truck, tram, tricycle]
  train_purpose: source_train
  dev_purpose: source_dev
environment:
  python: '3.12'
  torch: 2.14.0+cu130
  torchvision: 0.29.0+cu130
  ultralytics: 8.4.171
model:
  path: weights/yolo11m.pt
  provenance: weights/yolo11m.provenance.json
  url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11m.pt
training:
  epochs: 100
  imgsz: 640
  seed: 17
  amp: true
  batch: 16
  workers: 4
  cache: false
  optimizer: SGD
  lr0: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: true
  lrf: 0.01
  nbs: 64
  close_mosaic: 10
  patience: 20
selection:
  metric: pedestrian_car_ap50_95_macro
  class_ids: [0, 2]
  tie_policy: retain_earlier
  checkpoint_period: 5
monitor:
  enabled: true
  every: 1
  batch: 16
  workers: 0
smoke:
  train_images: 64
  dev_images: 32
  epochs: 2
  batch: 2
  workers: 0
cloud:
  gpu_name_contains: RTX 4090
  min_vram_gib: 23
  min_cpus: 8
  min_ram_gib: 30
  min_free_disk_gib: 40
  min_total_disk_gib: 46
  batch_fallback: 8

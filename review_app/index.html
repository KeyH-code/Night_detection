<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>数据复核台 · 夜间道路检测</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到审核内容</a>
  <header class="masthead">
    <div class="brand"><span class="brand-mark" aria-hidden="true">ND</span><div><span class="eyebrow">NIGHT DETECTION / DATA REVIEW</span><h1>数据复核台</h1></div></div>
    <div class="header-actions"><span id="saved-count">尚无人工审核记录</span><button id="export" class="primary" disabled>导出审核记录</button></div>
  </header>
  <main>
    <section class="source-strip" aria-label="数据来源状态"><span class="source-state" id="source-state">正在核验来源…</span><span>原始 train / val · 本机查看</span><a href="?view=source" data-view="source">查看来源依据 ↗</a></section>
    <div class="intro"><div><p class="eyebrow">SODA10M / 官方有标注数据</p><h2 id="view-title">先看原图，再作判断。</h2><p id="view-description">正在读取审核清单。</p></div><div class="dataset-counts" id="dataset-counts"></div></div>
    <nav class="view-nav" aria-label="审核视图"><a href="?view=groups" data-view="groups">相似候选组</a><a href="?view=night" data-view="night">官方时段（只读）</a><a href="?view=source" data-view="source">来源与划分</a></nav>
    <section id="filters" class="filters" aria-label="筛选审核内容" hidden>
      <div class="field"><label for="mode">审核范围</label><select id="mode"></select></div>
      <div class="field"><label for="city">城市</label><select id="city"><option value="all">全部城市</option><option value="Shanghai">上海 / Shanghai</option><option value="Shenzhen">深圳 / Shenzhen</option><option value="Guangzhou">广州 / Guangzhou</option></select></div>
      <div class="field"><label for="reviewed">审核状态</label><select id="reviewed"><option value="all">全部状态</option><option value="unreviewed">未审核</option><option value="reviewed">已审核</option></select></div>
      <div class="field search-field"><label for="search">查找图片或分组</label><div class="search-control"><input id="search" type="search" autocomplete="off" placeholder="图片 ID、文件名或城市"><button id="clear-search" aria-label="清除搜索" hidden disabled>×</button></div></div>
    </section>
    <div class="workspace-heading"><p id="range-status" role="status">正在读取清单…</p><p class="helper">判断存于当前浏览器；离开前请导出。不会删图、改标或正式划分。</p></div>
    <section id="workspace" tabindex="-1" aria-label="审核内容"><div class="state-panel"><span class="spinner" aria-hidden="true"></span><h3>正在读取核验后的图片清单</h3></div></section>
    <nav id="pagination" class="pagination" aria-label="分页" hidden><button id="previous" disabled>上一页</button><span id="page-status"></span><button id="next" disabled>下一页</button></nav>
    <aside id="live-status" class="live-status" role="status" aria-live="polite"></aside>
    <footer>人工抽样用于确认问题是否存在；可疑样本比例不代表总体错误率。候选连通组不等于采集 sequence。</footer>
  </main>
</body>
</html>
